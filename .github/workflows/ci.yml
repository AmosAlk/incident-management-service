name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/amosalk/incident-management-service

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: incident_management
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENVIRONMENT: development
      DJANGO_SECRET_KEY: ci-only-secret-key

      POSTGRES_DB: incident_management
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      OIDC_ISSUER: http://localhost:8080/realms/test
      OIDC_AUDIENCE: incident-management-service
      OIDC_JWKS_URL: http://localhost:8080/realms/test/protocol/openid-connect/certs

      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: incident_ops

      OTEL_TRACING_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Django system checks
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=.
          --cov-report=term-missing

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2.0.3
        with:
          terraform_version: 1.17.2

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialise Terraform
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate

  build:
    name: Build container image
    needs:
      - test
      - terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
[project]
name = "incident-management-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.9",
    "djangorestframework-stubs>=3.17.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

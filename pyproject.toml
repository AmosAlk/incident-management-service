[project]
name = "incident-management-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.7,<5.8",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3,<3.19",
    "gunicorn>=27.0.1,<28",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-celery>=0.66b2",
    "opentelemetry-instrumentation-django>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.9",
    "djangorestframework-stubs>=3.17.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
